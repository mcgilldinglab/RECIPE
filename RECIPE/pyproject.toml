[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-pipeline"
version = "0.1.0"
description = "Packaged RECIPE workflow for bulk inference, PPI refinement, and single-cell transfer."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "matplotlib>=3.6",
  "networkx>=3.1",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pysam>=0.22",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.13",
  "torch>=2.1",
  "torch-geometric>=2.5",
  "typing_extensions>=4.9",
]

[project.optional-dependencies]
benchmarks = [
  "anndata>=0.9",
  "scanpy>=1.9",
]
test = [
  "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
